<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Race Timer">
  <title>SWRA Race Timer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before first paint (no flash of the wrong colours).
    try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('settings') || '{}').theme || 'dark'; } catch (e) {}
  </script>
</head>
<body>
  <!-- ---------- Loading screen ---------- -->
  <div class="splash" id="splash" role="img" aria-label="SWRA Race Timer loading">
    <svg class="splash-scene" viewBox="0 0 360 230" aria-hidden="true">
      <defs>
        <path id="course" d="M30,115 A150,74 0 1,0 330,115 A150,74 0 1,0 30,115"/>
        <linearGradient id="fuse" x1="0" y1="-1" x2="0" y2="1">
          <stop offset="0" stop-color="#ff6b5e"/><stop offset=".5" stop-color="#e8382c"/><stop offset="1" stop-color="#a8211a"/>
        </linearGradient>
        <linearGradient id="wing" x1="0" y1="-1" x2="0" y2="1">
          <stop offset="0" stop-color="#ffe680"/><stop offset=".5" stop-color="#ffd23f"/><stop offset="1" stop-color="#e0a800"/>
        </linearGradient>
        <radialGradient id="canopy" cx=".35" cy=".35" r=".8">
          <stop offset="0" stop-color="#bfe6ff"/><stop offset=".35" stop-color="#3a6ea5"/><stop offset="1" stop-color="#14243d"/>
        </radialGradient>
        <radialGradient id="glow" r=".5"><stop offset="0" stop-color="#ff8a2a" stop-opacity=".55"/><stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/></radialGradient>
        <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
        <!-- Top-down pylon racer, nose pointing +x -->
        <g id="plane">
          <path d="M-13,-1.2 L-16.5,-8 L-19.5,-8 L-18.5,-1.2 L-18.5,1.2 L-19.5,8 L-16.5,8 L-13,1.2 Z" fill="url(#wing)" stroke="#5a3d00" stroke-width=".5"/>
          <path d="M8,-2 L4.5,-19 L0.5,-19 L-1.5,-2 L-1.5,2 L0.5,19 L4.5,19 L8,2 Z" fill="url(#wing)" stroke="#5a3d00" stroke-width=".5"/>
          <path d="M3.4,-18.6 L4.5,-19 L0.5,-19 L0.9,-18.6 Z M3.4,18.6 L4.5,19 L0.5,19 L0.9,18.6 Z" fill="#e8382c"/>
          <path d="M19,0 C19,-2.6 14,-3.4 6,-3.4 L-18,-1.4 L-18,1.4 L6,3.4 C14,3.4 19,2.6 19,0 Z" fill="url(#fuse)" stroke="#5c120d" stroke-width=".5"/>
          <path d="M-17,0 L9,0" stroke="#fff" stroke-width=".9" stroke-opacity=".85"/>
          <ellipse cx="6.5" cy="0" rx="4.2" ry="2.1" fill="url(#canopy)"/>
          <circle cx="19.3" cy="0" r="1.3" fill="#ddd"/>
          <ellipse class="prop" cx="20.2" cy="0" rx=".9" ry="8" fill="#fff" fill-opacity=".45">
            <animate attributeName="ry" values="8;2;8" dur=".09s" repeatCount="indefinite"/>
          </ellipse>
        </g>
      </defs>

      <!-- course -->
      <ellipse cx="180" cy="115" rx="150" ry="74" fill="none" class="course-line" stroke-width="1.5" stroke-dasharray="3 7">
        <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1s" repeatCount="indefinite"/>
      </ellipse>

      <!-- pylons -->
      <g class="pylon" transform="translate(98 115)">
        <circle r="18" fill="url(#glow)"><animate attributeName="r" values="14;20;14" dur="1.6s" repeatCount="indefinite"/></circle>
        <ellipse cx="3" cy="4" rx="9" ry="7" fill="#000" opacity=".3" filter="url(#soft)"/>
        <circle r="8.5" fill="#ff7a1a"/><circle r="6" fill="#fff"/><circle r="3.6" fill="#ff7a1a"/><circle r="1.3" fill="#fff"/>
      </g>
      <g class="pylon" transform="translate(262 115)">
        <circle r="18" fill="url(#glow)"><animate attributeName="r" values="14;20;14" dur="1.6s" begin=".8s" repeatCount="indefinite"/></circle>
        <ellipse cx="3" cy="4" rx="9" ry="7" fill="#000" opacity=".3" filter="url(#soft)"/>
        <circle r="8.5" fill="#ff7a1a"/><circle r="6" fill="#fff"/><circle r="3.6" fill="#ff7a1a"/><circle r="1.3" fill="#fff"/>
      </g>

      <!-- checkered flag (waving) -->
      <g transform="translate(166 86)">
        <rect x="-1.6" y="-2" width="2.4" height="42" rx="1.2" fill="#c9ced8"/>
        <circle cx="-.4" cy="-2.5" r="2" fill="#ffd23f"/>
        <g class="flag">
          <g><animateTransform attributeName="transform" type="translate" values="0 -1.5;0 1.5;0 -1.5" dur=".9s" repeatCount="indefinite"/>
            <rect x="1" y="0" width="6" height="6" fill="#fff"/><rect x="1" y="6" width="6" height="6" fill="#111"/><rect x="1" y="12" width="6" height="6" fill="#fff"/><rect x="1" y="18" width="6" height="6" fill="#111"/></g>
          <g><animateTransform attributeName="transform" type="translate" values="0 -1.5;0 1.5;0 -1.5" dur=".9s" begin="-.15s" repeatCount="indefinite"/>
            <rect x="7" y="0" width="6" height="6" fill="#111"/><rect x="7" y="6" width="6" height="6" fill="#fff"/><rect x="7" y="12" width="6" height="6" fill="#111"/><rect x="7" y="18" width="6" height="6" fill="#fff"/></g>
          <g><animateTransform attributeName="transform" type="translate" values="0 -1.5;0 1.5;0 -1.5" dur=".9s" begin="-.3s" repeatCount="indefinite"/>
            <rect x="13" y="0" width="6" height="6" fill="#fff"/><rect x="13" y="6" width="6" height="6" fill="#111"/><rect x="13" y="12" width="6" height="6" fill="#fff"/><rect x="13" y="18" width="6" height="6" fill="#111"/></g>
          <g><animateTransform attributeName="transform" type="translate" values="0 -1.5;0 1.5;0 -1.5" dur=".9s" begin="-.45s" repeatCount="indefinite"/>
            <rect x="19" y="0" width="6" height="6" fill="#111"/><rect x="19" y="6" width="6" height="6" fill="#fff"/><rect x="19" y="12" width="6" height="6" fill="#111"/><rect x="19" y="18" width="6" height="6" fill="#fff"/></g>
          <g><animateTransform attributeName="transform" type="translate" values="0 -1.5;0 1.5;0 -1.5" dur=".9s" begin="-.6s" repeatCount="indefinite"/>
            <rect x="25" y="0" width="6" height="6" fill="#fff"/><rect x="25" y="6" width="6" height="6" fill="#111"/><rect x="25" y="12" width="6" height="6" fill="#fff"/><rect x="25" y="18" width="6" height="6" fill="#111"/></g>
        </g>
      </g>

      <!-- smoke trail (dots chase the plane along the course) -->
      <g class="trail" id="trail"></g>

      <!-- plane shadow, then plane -->
      <g transform="translate(7 11)" opacity=".28" filter="url(#soft)">
        <g><animateMotion dur="3.2s" begin="-1s" repeatCount="indefinite" rotate="auto"><mpath href="#course"/></animateMotion>
          <g transform="scale(1.45)" fill="#000"><path d="M-13,-1.2 L-16.5,-8 L-19.5,-8 L-18.5,-1.2 L-18.5,1.2 L-19.5,8 L-16.5,8 L-13,1.2 Z"/><path d="M8,-2 L4.5,-19 L0.5,-19 L-1.5,-2 L-1.5,2 L0.5,19 L4.5,19 L8,2 Z"/><path d="M19,0 C19,-2.6 14,-3.4 6,-3.4 L-18,-1.4 L-18,1.4 L6,3.4 C14,3.4 19,2.6 19,0 Z"/></g></g>
      </g>
      <g transform="scale(1)">
        <g><animateMotion dur="3.2s" begin="-1s" repeatCount="indefinite" rotate="auto"><mpath href="#course"/></animateMotion>
          <use href="#plane" transform="scale(1.45)"/></g>
      </g>
    </svg>
    <script>
      // Smoke trail: dots that follow the plane a little behind it.
      (function () {
        var ns = 'http://www.w3.org/2000/svg', trail = document.getElementById('trail');
        for (var k = 4; k <= 22; k++) {
          var c = document.createElementNS(ns, 'circle');
          c.setAttribute('r', (3.2 - k * 0.11).toFixed(2));
          c.setAttribute('fill-opacity', (0.55 - k * 0.023).toFixed(3));
          var m = document.createElementNS(ns, 'animateMotion');
          m.setAttribute('dur', '3.2s'); m.setAttribute('repeatCount', 'indefinite');
          m.setAttribute('begin', (-1 + k * 0.03).toFixed(3) + 's');
          var mp = document.createElementNS(ns, 'mpath'); mp.setAttribute('href', '#course');
          m.appendChild(mp); c.appendChild(m); trail.appendChild(c);
        }
      })();
    </script>
    <div class="splash-title">
      <div class="splash-brand">SWRA</div>
      <div class="splash-name">Race Timer</div>
      <div class="splash-bar"><span></span></div>
    </div>
  </div>

  <main class="app" data-phase="idle">
    <header class="controls">
      <div class="seg" role="radiogroup" aria-label="Race type" id="raceTypes"></div>
      <div class="toolbar">
        <button class="toggle" id="lapSounds" role="switch" aria-checked="true">
          <span class="toggle-dot"></span><span>Lap sounds</span>
        </button>
        <span class="spacer"></span>
        <button class="icon-btn" id="openHeats" aria-label="Heats">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Heats</span>
        </button>
        <button class="icon-btn" id="openLog" aria-label="Race log">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>Log</span>
        </button>
        <button class="icon-btn" id="openSettings" aria-label="Settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg><span>Settings</span>
        </button>
      </div>
    </header>

    <section class="display" aria-live="polite">
      <div class="heat-banner" id="heatBanner" hidden></div>
      <div class="status" id="status">Ready</div>
      <div class="big" id="big">0</div>
      <div class="sub" id="sub">of 10 laps</div>
      <div class="lapbar" aria-hidden="true"><div class="lapbar-fill" id="lapFill"></div></div>
      <div class="clock">
        <div><span class="clock-label">Remaining</span><span class="clock-val" id="remaining">2:30.0</span></div>
        <div><span class="clock-label">Next lap</span><span class="clock-val" id="nextLap">15.0</span></div>
        <div><span class="clock-label">Elapsed</span><span class="clock-val" id="elapsed">0:00.0</span></div>
      </div>
    </section>

    <footer class="actions">
      <div class="action-row">
        <button class="second-btn" id="secondBtn" hidden>Pause</button>
        <button class="main-btn" id="mainBtn"><span class="main-label">Start</span></button>
      </div>
      <div class="hint" id="hint">&nbsp;</div>
      <button class="link-btn" id="testBtn">Test sound</button>
    </footer>
  </main>

  <!-- ---------- Settings ---------- -->
  <dialog class="sheet" id="settingsSheet">
    <form method="dialog" class="sheet-head"><h2>Settings</h2><button class="close" aria-label="Close">Done</button></form>
    <div class="sheet-body">
      <section>
        <h3>Sound</h3>
        <label class="row">Volume <input type="range" id="volume" min="0" max="100" step="1"></label>
        <label class="row">Voice countdown <input type="checkbox" class="switch" id="voiceCountdown"></label>
        <label class="row">Time warnings <small>“One minute”, “Thirty seconds”</small><input type="checkbox" class="switch" id="warnings"></label>
        <label class="row">Countdown length
          <select id="countdownLen"><option value="5">5 s</option><option value="10">10 s</option><option value="15">15 s</option><option value="20">20 s</option></select>
        </label>
      </section>
      <section>
        <h3>Voice</h3>
        <label class="row">Voice <select id="voiceSelect"></select></label>
        <label class="row" id="rateRow">Speaking speed <input type="range" id="rate" min="0.7" max="1.6" step="0.05"></label>
        <button type="button" class="pill" id="previewVoice">Preview voice</button>
      </section>
      <section>
        <h3>Display</h3>
        <div class="row">Theme
          <div class="mini-seg" id="themeSeg">
            <button type="button" data-theme="dark">Dark</button>
            <button type="button" data-theme="sun">Sunlight</button>
          </div>
        </div>
      </section>
      <section>
        <h3>Custom race types</h3>
        <ul class="list" id="customList"></ul>
        <form class="add-race" id="addRaceForm">
          <input id="crName" placeholder="Name" maxlength="16" required>
          <input id="crTotal" type="number" inputmode="numeric" min="10" max="3600" placeholder="Race s" required>
          <input id="crLap" type="number" inputmode="numeric" min="2" max="600" placeholder="Lap s" required>
          <button class="pill">Add</button>
        </form>
      </section>
      <p class="about" id="about"></p>
    </div>
  </dialog>

  <!-- ---------- Heats ---------- -->
  <dialog class="sheet" id="heatsSheet">
    <form method="dialog" class="sheet-head"><h2>Heats</h2><button class="close" aria-label="Close">Done</button></form>
    <div class="sheet-body">
      <p class="note">Queue up a run of heats. Between heats the app can count down a break and start the next heat on its own.</p>
      <ol class="list heats" id="heatList"></ol>
      <div class="btn-row">
        <button type="button" class="pill" id="addHeat">+ Add heat</button>
        <button type="button" class="pill ghost" id="clearHeats">Clear</button>
      </div>
      <label class="row">Break between heats
        <select id="heatGap">
          <option value="0">Manual start</option><option value="30">30 s</option><option value="60">1 min</option>
          <option value="120">2 min</option><option value="180">3 min</option><option value="300">5 min</option>
        </select>
      </label>
      <button type="button" class="wide-btn" id="seqToggle">Start heat sequence</button>
    </div>
  </dialog>

  <!-- ---------- Log ---------- -->
  <dialog class="sheet" id="logSheet">
    <form method="dialog" class="sheet-head"><h2>Race log</h2><button class="close" aria-label="Close">Done</button></form>
    <div class="sheet-body">
      <div class="btn-row">
        <button type="button" class="pill" id="shareLog">Share</button>
        <button type="button" class="pill" id="csvLog">Download CSV</button>
        <button type="button" class="pill ghost" id="clearLog">Clear</button>
      </div>
      <ul class="list log" id="logList"></ul>
    </div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
